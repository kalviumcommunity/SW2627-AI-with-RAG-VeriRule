<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0D1B3E"/>
      <stop offset="100%" stop-color="#6C3FC5"/>
    </linearGradient>
    <linearGradient id="shieldGrad2" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1a2f6e"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Shield body -->
  <path d="M50 5 L88 20 L88 52 C88 72 70 88 50 95 C30 88 12 72 12 52 L12 20 Z" fill="url(#shieldGrad)"/>
  <!-- Shield inner highlight -->
  <path d="M50 12 L82 25 L82 52 C82 68 66 82 50 88 C34 82 18 68 18 52 L18 25 Z" fill="url(#shieldGrad2)" opacity="0.5"/>
  <!-- V-check mark -->
  <path d="M30 46 L43 60 L70 34" stroke="white" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
</svg>
